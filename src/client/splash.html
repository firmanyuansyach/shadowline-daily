<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Shadowline — Daily Silhouette</title>
  </head>
  <body class="app">
    <div class="card">
      <header class="head">
        <h1 class="title">SHADOWLINE</h1>
        <p class="tagline">Match the shadow. One object, one day.</p>
      </header>
      <div class="teaser" aria-label="Today's silhouette teaser">
        <svg id="teaser-svg" viewBox="0 0 100 100" role="img" aria-label="Today's silhouette"></svg>
      </div>
      <div class="meta">
        <span id="puzzle-label">Loading…</span>
        <span id="difficulty-label"></span>
      </div>
      <div class="stats">
        <span id="streak-label"></span>
        <span id="solve-label"></span>
      </div>
      <button class="play-button" id="play-button" type="button">▶&nbsp; Play today</button>
      <p class="hint">Drag to rotate. Lock it in when the shadow matches.</p>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
